[package]
name = "rlsp-yaml"
version = "0.14.1"
edition = "2024"
rust-version = "1.98"
description = "A fast, lightweight YAML language server"
authors.workspace = true
license.workspace = true
repository.workspace = true
homepage = "https://github.com/chdalski/rlsp"
keywords = ["yaml", "lsp", "language-server"]
categories = ["development-tools", "text-editors"]
exclude = ["tests/fixtures/schemas/"]

[lints]
workspace = true

[dependencies]
rlsp-fmt = { version = "0.1.9", path = "../rlsp-fmt" }
rlsp-yaml-parser = { version = "0.11", path = "../rlsp-yaml-parser" }
tower-lsp = { version = "0.20", features = ["proposed"] }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
serde = "1"
regex = "1"
once_cell = "1"
ureq = { version = "3", features = ["rustls"] }
idna = "1.1"
iri-string = "0.7"
data-encoding = "2.11"
ec4rs = "1.2.0"

[dev-dependencies]
criterion = { version = "0.8", features = ["html_reports"] }
futures = "0.3"
proptest = "1"
rstest = "0.28"
tempfile = "3.27.0"
tiny_http = "0.12"
tower = "0.5"

# Used by the stack-cache canary in src/schema.rs, which compiles only here.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dev-dependencies]
rustix = { version = "1", features = ["process"] }

[[bench]]
name = "hot_path"
harness = false

[[bench]]
name = "latency"
harness = false

[[bench]]
name = "insight"
harness = false
