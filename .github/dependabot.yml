version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      rust-dependencies:
        patterns: ["*"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    # dtolnay/rust-toolchain publishes toolchain versions as git branches,
    # pre-created ahead of the actual Rust release, not as tags. Dependabot
    # reads branch names as version strings and proposes the highest-sorting
    # one, with no knowledge of whether that Rust release has shipped yet.
    # The pin is bumped manually together with rust-toolchain.toml and all
    # 8 workflow refs in one deliberate commit, never via automated PR.
    ignore:
      - dependency-name: "dtolnay/rust-toolchain"
  - package-ecosystem: "npm"
    directory: "/rlsp-yaml/integrations/vscode"
    schedule:
      interval: "weekly"
    groups:
      vscode-extension-dependencies:
        patterns: ["*"]
    # typescript-eslint does not yet support TypeScript 7.0 (tracked in
    # typescript-eslint#10940: support starts at TS >=7.1), and lint is a
    # required project gate. Block the major only; minor/patch keep flowing.
    # Remove this ignore once typescript-eslint supports TS >=7.1.
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  # The Zed extension crate declares its own `[workspace]` table (Cargo.toml)
  # and therefore sits outside the root Cargo workspace covered by the cargo
  # entry above. Dependabot's cargo updater resolves per manifest directory,
  # so a second entry is required to reach this crate's Cargo.toml/Cargo.lock.
  - package-ecosystem: "cargo"
    directory: "/rlsp-yaml/integrations/zed"
    schedule:
      interval: "weekly"
    groups:
      zed-extension-dependencies:
        patterns: ["*"]
