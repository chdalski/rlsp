name: Coverage

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@v2.85.11
        with:
          tool: cargo-llvm-cov
      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  coverage-vscode:
    name: VS Code Extension Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: rlsp-yaml/integrations/vscode/package.json
      - uses: actions/setup-node@v7
        with:
          # Node 24 is Active LTS (until 2026-10-20); Node 22 entered
          # maintenance 2025-10-21 (EOL 2027-04-30). This pin governs
          # build/test tooling only -- the shipped extension runs on the
          # Node bundled with VS Code, not this version. Revisit when
          # Node 26 becomes LTS (2026-10-28) or Node 24 nears EOL.
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: rlsp-yaml/integrations/vscode/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: rlsp-yaml/integrations/vscode
      - name: Generate coverage report
        run: pnpm run test:coverage
        working-directory: rlsp-yaml/integrations/vscode
      - name: Upload to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: rlsp-yaml/integrations/vscode/coverage/lcov.info
          flags: vscode
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true

  vscode-static-checks:
    name: VS Code Extension Static Checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: rlsp-yaml/integrations/vscode/package.json
      - uses: actions/setup-node@v7
        with:
          # Node 24 is Active LTS (until 2026-10-20); Node 22 entered
          # maintenance 2025-10-21 (EOL 2027-04-30). This pin governs
          # build/test tooling only -- the shipped extension runs on the
          # Node bundled with VS Code, not this version. Revisit when
          # Node 26 becomes LTS (2026-10-28) or Node 24 nears EOL.
          node-version: '24'
          cache: 'pnpm'
          cache-dependency-path: rlsp-yaml/integrations/vscode/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install
        working-directory: rlsp-yaml/integrations/vscode
      - name: Typecheck
        run: pnpm run typecheck
        working-directory: rlsp-yaml/integrations/vscode
      - name: Lint
        run: pnpm run lint
        working-directory: rlsp-yaml/integrations/vscode
      - name: Format
        run: pnpm run format
        working-directory: rlsp-yaml/integrations/vscode
